org.gradle.jvmargs=-Xmx1g
# The released version under test, from Central. For an unreleased tree: `./gradlew publishToMavenLocal`
# in ../teams4j, then `-Pteams4jVersion=<what its printVersion printed>`.
teams4jVersion=0.1.0
# Boot version for :boot-app. Override to check the other Boot line:
#   ./gradlew :boot-app:run -PbootVersion=4.1.1
bootVersion=3.5.16
# Kotlin for :kotlin-cli. kotlinBaseline in teams4j's gradle/libs.versions.toml is the supported minimum:
#   ./gradlew :kotlin-cli:run -PkotlinVersion=2.2.21
kotlinVersion=2.4.10
